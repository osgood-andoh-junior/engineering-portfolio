[project]
name = "fpl-oracle-ai"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.34,<1", "pydantic-settings>=2.7,<3", "sqlalchemy>=2.0,<3", "alembic>=1.14,<2", "psycopg[binary]>=3.2,<4", "redis>=5,<9", "httpx>=0.28,<1", "pandas>=2.2,<4", "numpy>=2,<3", "scikit-learn>=1.6,<2", "pyarrow>=19", "catboost>=1.2.8,<2", "lightgbm>=4.6,<5", "torch>=2.6,<3", "ortools>=9.12,<10", "scipy>=1.15,<2", "pytest>=8,<10"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "--basetemp=data/pytest-temp"

[project.optional-dependencies]
dev = ["ruff>=0.14,<1"]

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["apps*", "ml*", "workers*", "scripts*"]
exclude = ["apps.web*"]
