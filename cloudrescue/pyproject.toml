[project]
name = "cloudrescue"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "pydantic-settings>=2.8,<3",
  "sqlalchemy>=2.0,<2.1",
  "alembic>=1.15,<2",
  "psycopg[binary]>=3.2,<4",
  "httpx>=0.28,<1",
  "opentelemetry-api>=1.30,<2",
]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1", "mypy>=1.15,<3"]

[tool.pytest.ini_options]
pythonpath = [".", "packages/reliability-traces"]

[tool.ruff]
line-length = 100
