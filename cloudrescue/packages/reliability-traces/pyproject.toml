[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cloudrescue-traces"
version = "0.1.0"
description = "Validate and normalize local reliability workload traces"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
dependencies = []

[project.scripts]
cloudrescue-traces = "cloudrescue_traces:main"

[tool.hatch.build.targets.wheel]
packages = ["cloudrescue_traces"]
