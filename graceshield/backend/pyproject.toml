[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "graceshield-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.34,<1", "pydantic-settings>=2.8,<3", "sqlalchemy>=2.0.39,<2.1", "alembic>=1.15,<2", "psycopg[binary]>=3.2,<4", "pwdlib[argon2]>=0.2,<1", "email-validator>=2.2,<3", "httpx>=0.28,<1"]

[project.optional-dependencies]
dev = ["pytest>=8.3,<10", "ruff>=0.11,<1", "mypy>=1.15,<2", "pip-audit>=2.8,<3"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: isolated cloud PostgreSQL required"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501", "B008"]

[tool.mypy]
python_version = "3.12"
files = ["app/core", "app/services/rules.py", "app/integrations"]
check_untyped_defs = true
ignore_missing_imports = true
